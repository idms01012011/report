<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ใบปิดงาน</title>
<link rel="stylesheet" href="styles_updated.css">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/thsarabun.js"></script>
<script src="js/thsarabun-bold.js"></script>
</head>
<body>
<div class="container">
<h2 class="title">📄 ใบปิดงาน</h2>
<form id="closeWorkForm">
<div class="form-row">
<input id="closeNo" placeholder="เลขที่ใบงาน" required="" type="text"/>
<input id="WorkType" placeholder="ประเภทงาน" required="" type="text"/>
<input id="closeDate" required="" type="date"/>
</div>
<input id="hospital" placeholder="ชื่อโรงพยาบาล" required="" type="text"/>
<div class="form-row">
<input id="deviceName" placeholder="ชื่อเครื่อง" required="" type="text"/>
<input id="brand" placeholder="ยี่ห้อ" required="" type="text"/>
</div>
<div class="form-row">
<input id="model" placeholder="รุ่น" required="" type="text"/>
<input id="serial" placeholder="หมายเลขเครื่อง" required="" type="text"/>
</div>
<input id="assetNo" placeholder="หมายเลขครุภัณฑ์" required="" type="text"/>
<input id="Accessories" placeholder="อุปกรณ์ที่ส่งมาด้วย" required="" type="text"/>
<textarea id="issue" placeholder="อาการที่แจ้งเสีย" required="" rows="3"></textarea>
<textarea id="solution" placeholder="ผลการซ่อม/แก้ไข" required="" rows="3"></textarea>
<input id="guarantee" placeholder="รับประกัน" required="" type="text"/>


<!-- ข้อมูลลูกค้า -->
<h3 style="margin-top: 20px; color: #333;">👤 ข้อมูลลูกค้า</h3>
<div class="form-row">
<input id="customerName" placeholder="ชื่อผู้ติดต่อลูกค้า" required="" type="text"/>
<input id="customerPhone" placeholder="เบอร์โทรลูกค้า" required="" type="tel"/>
</div>
<label>🖊️ ลายเซ็นลูกค้า</label>
<canvas height="100" id="signCustomer" width="300"></canvas>
<button class="btn small" onclick="clearCanvas('signCustomer')" type="button">ล้างลายเซ็น</button>

<!-- ข้อมูลบริษัท -->
<h3 style="margin-top: 20px; color: #333;">🏢 ข้อมูลบริษัท</h3>
<div class="form-row">
<input id="companyName" placeholder="ชื่อผู้ปฏิบัติงาน (บริษัท)" required="" type="text"/>
<input id="companyPhone" placeholder="เบอร์โทรบริษัท" required="" type="tel"/>
</div>
<label>🖊️ ลายเซ็นบริษัท</label>
<canvas height="100" id="signCompany" width="300"></canvas>
<button class="btn small" onclick="clearCanvas('signCompany')" type="button">ล้างลายเซ็น</button>

<div class="form-buttons">
<button class="btn primary" onclick="previewPDF('close')" type="button">👁️ ดูตัวอย่าง</button>
<button class="btn primary" onclick="downloadPDF('close')" type="button">📄 สร้าง PDF</button>
<a class="btn secondary" href="main.html">🔙 กลับ</a>
</div>

<h3 style="margin-top: 20px; color: #333;">📷 รูปประกอบ</h3>
<label>📷 รูปประกอบ 1</label>
<input accept="image/*" id="img1" onchange="previewImage('img1', 'preview1')" type="file"/>
<img class="inline-image" id="preview1"/>
<label>📷 รูปประกอบ 2</label>
<input accept="image/*" id="img2" onchange="previewImage('img2', 'preview2')" type="file"/>
<img class="inline-image" id="preview2"/>

</form>
<div id="previewContainer" style="display: none; margin-top: 20px;">
<h3>ตัวอย่าง PDF</h3>
<iframe id="previewPDF" style="width:100%;height:400px;border:1px solid #ddd;"></iframe>
</div>
</div>
<script src="js/logo.js"></script>
<script src="js/shared.js"></script>
</body>
</html>
