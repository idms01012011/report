<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>เข้าสู่ระบบ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="styles_updated.css" rel="stylesheet"/></head>
<body>
<div class="container center">
<h2 class="title">🔐 เข้าสู่ระบบ</h2>
<form class="form-section" onsubmit="return login()">
<input id="username" placeholder="ชื่อผู้ใช้" required="" type="text"/>
<input id="password" placeholder="รหัสผ่าน" required="" type="password"/>
<button class="btn primary" type="submit">➡️ เข้าสู่ระบบ</button>
</form>
</div>
<script>
    function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (u === 'admin' && p === 'admin123') {
        localStorage.setItem('auth', '1');
        window.location.href = 'main.html';
      } else {
        alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      }
      return false;
    }
  </script>
</body>
</html>
