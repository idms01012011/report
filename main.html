<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เมนูหลัก</title>
  <link rel="stylesheet" href="styles_updated.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container center">
    <h2 class="title">📋 เมนูหลัก</h2>
    <div class="menu-buttons">
      <a href="open_work.html" class="btn large">📝 Service Report</a>
      <!--a href="close_work.html" class="btn large">✅ ใบปิดงาน</a-->
      <button onclick="logout()" class="btn secondary large">🚪 ออกจากระบบ</button>
    </div>
  </div>
  <script>
    if (localStorage.getItem('auth') !== '1') {
      window.location.href = 'login.html';
    }
    function logout() {
      localStorage.removeItem('auth');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
